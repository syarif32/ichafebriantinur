<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-label="Logo utama Icha Febrianti Nur – Grow in the Future">
  <defs>
    <!-- Palet warna solid agar tetap tajam pada berbagai ukuran. -->
  </defs>
  <!-- Ikon utama -->
  <g id="ifn-icon" transform="translate(160 32)">
  <!-- Lingkaran terbuka: empati, kebebasan, dan batas pribadi -->
  <path d="M250 80 A120 120 0 1 0 272 202"
        fill="none" stroke="#0F4C5C" stroke-width="13"
        stroke-linecap="round"/>
  <!-- Matahari terbit: optimisme dan kebahagiaan -->
  <circle cx="123" cy="135" r="17" fill="#FFB703"/>
  <!-- Batang grafik: accounting, tax, audit, dan pertumbuhan terukur -->
  <rect x="100" y="194" width="25" height="44" rx="7" fill="#0F4C5C"/>
  <rect x="140" y="171" width="25" height="67" rx="7" fill="#0F4C5C"/>
  <rect x="180" y="150" width="25" height="88" rx="7" fill="#2A9D8F"/>
  <!-- Batang grafik tertinggi berubah menjadi tunas yang mengarah kanan-atas -->
  <path d="M192 153 C199 137 208 125 222 114"
        fill="none" stroke="#2A9D8F" stroke-width="10"
        stroke-linecap="round"/>
  <!-- Daun kiri: potensi yang terus tumbuh -->
  <path d="M225 116 C197 111 189 99 191 83 C210 86 222 98 225 116 Z"
        fill="#2A9D8F"/>
  <!-- Daun kanan berbentuk sayap: kebebasan bergerak ke masa depan -->
  <path d="M220 118 C216 86 237 74 266 71 C264 94 247 113 220 118 Z"
        fill="#8ECAE6"/>
  </g>
  <!-- Identitas nama -->
  <g id="ifn-wordmark" font-family="'Nunito', 'Poppins', 'Montserrat', 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="320" y="415" fill="#0F4C5C" font-weight="700" font-size="49" letter-spacing="-.8">Icha Febrianti Nur</text>
    <text x="320" y="465" fill="#2A9D8F" font-weight="700" font-size="26" letter-spacing="1.8">Grow in the Future</text>
    <text x="320" y="505" fill="#46636A" font-weight="500" font-size="17" letter-spacing="1.1">Accounting • Tax • Audit • Tech</text>
  </g>
</svg>
