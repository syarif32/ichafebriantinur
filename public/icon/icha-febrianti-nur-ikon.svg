<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Ikon personal branding Icha Febrianti Nur">
  <defs>
    <!-- Ikon solid tanpa dependensi font atau tautan eksternal -->
  </defs>
  <g id="ifn-icon">
  <!-- Lingkaran terbuka: empati, kebebasan, dan batas pribadi -->
  <path d="M250 80 A120 120 0 1 0 272 202"
        fill="none" stroke="#0F4C5C" stroke-width="13"
        stroke-linecap="round"/>
  <!-- Matahari terbit: optimisme dan kebahagiaan -->
  <circle cx="123" cy="135" r="17" fill="#FFB703"/>
  <!-- Batang grafik: accounting, tax, audit, dan pertumbuhan terukur -->
  <rect x="100" y="194" width="25" height="44" rx="7" fill="#0F4C5C"/>
  <rect x="140" y="171" width="25" height="67" rx="7" fill="#0F4C5C"/>
  <rect x="180" y="150" width="25" height="88" rx="7" fill="#2A9D8F"/>
  <!-- Batang grafik tertinggi berubah menjadi tunas yang mengarah kanan-atas -->
  <path d="M192 153 C199 137 208 125 222 114"
        fill="none" stroke="#2A9D8F" stroke-width="10"
        stroke-linecap="round"/>
  <!-- Daun kiri: potensi yang terus tumbuh -->
  <path d="M225 116 C197 111 189 99 191 83 C210 86 222 98 225 116 Z"
        fill="#2A9D8F"/>
  <!-- Daun kanan berbentuk sayap: kebebasan bergerak ke masa depan -->
