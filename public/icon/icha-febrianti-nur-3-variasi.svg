<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 770" role="img"
     aria-label="Tiga variasi logo Icha Febrianti Nur">
  <defs>
    <!-- Simbol utama reusable: lingkaran, grafik, matahari, tunas/sayap. -->
    <g id="ifn-symbol">
      <!-- Lingkaran merangkul dengan celah selektif di sisi kanan. -->
      <path d="M250 80 A120 120 0 1 0 272 202"
            fill="none" stroke="#0F4C5C" stroke-width="13"
            stroke-linecap="round"/>
      <!-- Matahari: kebahagiaan dan harapan. -->
      <circle cx="123" cy="135" r="17" fill="#FFB703"/>
      <!-- Grafik naik: accounting, tax, audit, dan pengambilan keputusan berbasis data. -->
      <rect x="100" y="194" width="25" height="44" rx="7" fill="#0F4C5C"/>
      <rect x="140" y="171" width="25" height="67" rx="7" fill="#0F4C5C"/>
      <rect x="180" y="150" width="25" height="88" rx="7" fill="#2A9D8F"/>
      <!-- Grafik berkembang menjadi batang tunas yang mengarah kanan-atas. -->
      <path d="M192 153 C199 137 208 125 222 114"
            fill="none" stroke="#2A9D8F" stroke-width="10"
            stroke-linecap="round"/>
      <!-- Dua daun membentuk sayap ringan dan terbuka. -->
      <path d="M225 116 C197 111 189 99 191 83 C210 86 222 98 225 116 Z"
            fill="#2A9D8F"/>
      <path d="M220 118 C216 86 237 74 266 71 C264 94 247 113 220 118 Z"
            fill="#8ECAE6"/>
    </g>
  </defs>

  <!-- 1. Logo utama: susunan vertikal. -->
  <g id="ifn-main">
    <use href="#ifn-symbol" transform="translate(100 64)"/>
    <g id="main-text" text-anchor="middle"
       font-family="Nunito, Poppins, Montserrat, 'Segoe UI', Arial, sans-serif">
      <text x="260" y="425" fill="#0F4C5C" font-size="39"
            font-weight="700" letter-spacing="-.65">Icha Febrianti Nur</text>
      <text x="260" y="473" fill="#2A9D8F" font-size="24"
            font-weight="700" letter-spacing="1.3">Grow in the Future</text>
      <text x="260" y="506" fill="#46636A" font-size="16"
            font-weight="500" letter-spacing=".8">Accounting • Tax • Audit • Tech</text>
    </g>
  </g>

  <!-- 2. Logo horizontal: ikon kiri, nama dan tagline kanan. -->
  <g id="ifn-horizontal">
    <use href="#ifn-symbol" transform="translate(541 70) scale(.69)"/>
    <g id="horizontal-text" text-anchor="start"
       font-family="Nunito, Poppins, Montserrat, 'Segoe UI', Arial, sans-serif">
      <text x="786" y="167" fill="#0F4C5C" font-size="41"
            font-weight="700" letter-spacing="-.65">Icha Febrianti Nur</text>
      <text x="787" y="208" fill="#2A9D8F" font-size="25"
            font-weight="700" letter-spacing="1.1">Grow in the Future</text>
      <text x="787" y="242" fill="#46636A" font-size="16"
            font-weight="500" letter-spacing=".8">Accounting • Tax • Audit • Tech</text>
    </g>
  </g>

  <!-- 3. Ikon mandiri: cocok untuk avatar dan favicon. -->
  <g id="ifn-avatar">
    <use href="#ifn-symbol" transform="translate(800 400) scale(1.03)"/>
  </g>
</svg>
