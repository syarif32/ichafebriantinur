<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 360 360" role="img" aria-label="Ikon Icha Febrianti Nur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g id="ikon">
  <!-- Cincin terbuka: batas pribadi yang selektif, celah kanan-atas = jalan menuju masa depan -->
  <path d="M356.9 149 A165 165 0 1 1 251 43.1" fill="none" stroke="#0F4C5C" stroke-width="10" stroke-linecap="round"/>
  <circle cx="356.9" cy="149" r="10" fill="#0F4C5C"/>
  <circle cx="251" cy="43.1" r="10" fill="#2A9D8F"/>
  <!-- Gelombang suara di sisi kiri: pendengar yang baik -->
  <path d="M116.4 299.6 A130 130 0 0 1 116.4 100.4" fill="none" stroke="#8ECAE6" stroke-width="8" stroke-linecap="round"/>
  <path d="M109.1 252.5 A105 105 0 0 1 109.1 147.5" fill="none" stroke="#8ECAE6" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- Garis dasar ledger -->
  <line x1="150" y1="320" x2="300" y2="320" stroke="#0F4C5C" stroke-width="5" stroke-linecap="round"/>
  <!-- Batang grafik naik: akuntansi, pajak, audit -->
  <rect x="232" y="290" width="14" height="24" rx="5" fill="#0F4C5C"/>
  <rect x="254" y="274" width="14" height="40" rx="5" fill="#0F4C5C"/>
  <rect x="276" y="256" width="14" height="58" rx="5" fill="#2A9D8F"/>
  <!-- Huruf i: batang = tunas dan sosok -->
  <line x1="200" y1="314" x2="200" y2="222" stroke="#0F4C5C" stroke-width="18" stroke-linecap="round"/>
  <!-- Daun kiri: potensi yang tumbuh -->
  <path d="M200 224 C165 219 140 194 135 162 C170 162 195 188 200 224 Z" fill="#2A9D8F"/>
  <!-- Daun kanan berbentuk sayap: kebebasan -->
  <path d="M200 224 C205 178 235 148 288 136 C288 190 252 218 200 224 Z" fill="#8ECAE6"/>
  <!-- Titik i = matahari: kebahagiaan -->
  <circle cx="200" cy="152" r="24" fill="#FFB703"/>
  <!-- Node teknologi pada ujung sayap -->
  <circle cx="288" cy="136" r="6" fill="#0F4C5C"/>
</g>
</svg>
